      max-height: 85vh;
      overflow: hidden;

      flex-direction: column;

    @media (min-width: 768px) {

    .wallet-modal-header {

    <script>
        // ==================== WALLET MODAL FUNCTIONS ====================
        function openWalletModal() {
            const modal = document.getElementById('wallet-modal');
            modal.style.display = 'flex';
        }

        function closeWalletModal() {
            const modal = document.getElementById('wallet-modal');
            modal.style.display = 'none';
        }

        function selectWallet(type) {
            closeWalletModal();

            setTimeout(() => {
                try {
                    if (type === 'metamask' || type === 'trust' || type === 'coinbase' || type === 'safe') {
                        if (typeof window.login === 'function') {
                            window.login();
                        } else if (typeof window.ConnectWallet === 'function') {
                            window.ConnectWallet();
                        }
                    } 
                    else if (type === 'walletconnect') {
                        if (typeof window.walletconnect === 'function') {
                            window.walletconnect();
                        } else if (typeof window.ConnectWallet === 'function') {
                            window.ConnectWallet(true);
                        }
                    }
                } catch (e) {
                    console.error('Wallet connection error:', e);
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({ icon: 'error', text: 'Failed to connect wallet' });
                    }
                }
            }, 150);
        }

        // Make sure existing onclick="login()" still works
        console.log('%c[HTML] Wallet modal integrated successfully', 'color:#22c55e');
    </script>
